name: Import Atmosynq World Assets

on:
  push:
    branches:
      - feat/v0.4.1-interactive-weather-portal
    paths:
      - .github/workflows/import-world-assets.yml

permissions:
  contents: write

jobs:
  import-world-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Fetch and normalize World scene assets
        shell: bash
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen

          from PIL import Image, ImageOps

          OUT = Path("app/src/main/assets/worlds")
          OUT.mkdir(parents=True, exist_ok=True)

          sources = {
              "forest_mist_lake.webp": (
                  "https://images.pexels.com/photos/9007463/pexels-photo-9007463.jpeg"
                  "?cs=srgb&dl=pexels-danila-popov-85164195-9007463.jpg&fm=jpg"
              ),
              "cabin_night_exterior.webp": (
                  "https://images.pexels.com/photos/9179968/pexels-photo-9179968.jpeg"
                  "?cs=srgb&dl=pexels-75707588-9179968.jpg&fm=jpg"
              ),
              "cabin_fireplace_interior.webp": (
                  "https://images.pexels.com/photos/37032232/pexels-photo-37032232.jpeg"
                  "?cs=srgb&dl=pexels-zulalhs-37032232.jpg&fm=jpg"
              ),
          }

          target_size = (1440, 2160)

          for filename, url in sources.items():
              request = Request(
                  url,
                  headers={
                      "User-Agent": "Atmosynq-asset-import/1.0",
                  },
              )
              with urlopen(request, timeout=45) as response:
                  raw = response.read()

              image = Image.open(BytesIO(raw)).convert("RGB")
              image = ImageOps.fit(
                  image,
                  target_size,
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5),
              )
              out = OUT / filename
              image.save(
                  out,
                  format="WEBP",
                  quality=88,
                  method=6,
              )

              check = Image.open(out)
              if check.size != target_size:
                  raise RuntimeError(
                      f"{filename} has unexpected size {check.size}"
                  )
              if out.stat().st_size < 120_000:
                  raise RuntimeError(
                      f"{filename} is unexpectedly tiny: {out.stat().st_size} bytes"
                  )

              print(
                  f"{filename}: {check.size[0]}x{check.size[1]} "
                  f"{out.stat().st_size} bytes"
              )
          PY

      - name: Commit normalized World assets
        shell: bash
        run: |
          git config user.name "Atmosynq Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/assets/worlds
          if git diff --cached --quiet; then
            echo "World assets already current."
            exit 0
          fi
          git commit -m "Import high-resolution Atmosynq World assets [world-assets]"
          git push origin "HEAD:${{ github.ref_name }}"
